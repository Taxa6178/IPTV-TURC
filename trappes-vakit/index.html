<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trappes - Namaz Vakitleri (Türkçe)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#0b1220; color:#fff; margin:0; padding:20px; display:flex; align-items:center; justify-content:center; height:100vh; }
    .card { background:linear-gradient(180deg,#0f1724 0,#071124 100%); padding:20px; border-radius:12px; width:420px; box-shadow:0 10px 30px rgba(0,0,0,.6); text-align:center; }
    h1 { margin:0 0 8px; font-size:20px; }
    .sub { color:#9fb0c8; font-size:13px; margin-bottom:14px; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    td { padding:8px 6px; border-bottom:1px solid rgba(255,255,255,0.04); }
    td.name { text-align:left; font-weight:600; }
    td.time { text-align:right; font-weight:700; }
    .next { margin-top:12px; background:#062534; padding:10px; border-radius:8px; }
    .countdown { font-size:20px; font-weight:800; margin-top:6px; }
    footer { margin-top:10px; font-size:12px; color:#7fa0bd; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Trappes, Fransa — Namaz Vakitleri</h1>
    <div class="sub">Tüm metinler Türkçe. Veri kaynağı: Aladhan API</div>
    <div id="dateLocal"></div>

    <table id="timesTable" aria-live="polite">
      <!-- Satırlar JS ile doldurulacak -->
    </table>

    <div class="next" id="nextBlock" style="display:none;">
      <div>Sonraki namaz: <span id="nextName"></span></div>
      <div class="countdown" id="countdown">--:--:--</div>
    </div>

    <footer>Güncelleme: <span id="updatedAt">--</span></footer>
  </div>

<script>
  const turkishNames = {
    Fajr: "İmsak",
    Sunrise: "Güneş",
    Dhuhr: "Öğle",
    Asr: "İkindi",
    Maghrib: "Akşam",
    Isha: "Yatsı"
  };

  const city = "Trappes";
  const country = "France";

  async function fetchTimings() {
    try {
      const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}&method=2`);
      const data = await res.json();
      if (data.code !== 200) throw new Error("API hatası");
      const timings = data.data.timings;
      const dateReadable = data.data.date.readable;
      document.getElementById('dateLocal').textContent = dateReadable;
      document.getElementById('updatedAt').textContent = new Date().toLocaleString('tr-TR');
      fillTable(timings);
      startCountdown(timings);
    } catch (err) {
      console.error(err);
      document.getElementById('timesTable').innerHTML = '<tr><td colspan="2">Vakit bilgisi alınamadı.</td></tr>';
    }
  }

  function fillTable(timings) {
    const order = ['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];
    const table = document.getElementById('timesTable');
    table.innerHTML = '';
    order.forEach(k => {
      const tr = document.createElement('tr');
      const tdName = document.createElement('td');
      tdName.className = 'name';
      tdName.textContent = turkishNames[k] || k;
      const tdTime = document.createElement('td');
      tdTime.className = 'time';
      tdTime.textContent = timings[k];
      tr.appendChild(tdName);
      tr.appendChild(tdTime);
      table.appendChild(tr);
    });
  }

  let countdownInterval = null;
  function startCountdown(timings) {
    if (countdownInterval) clearInterval(countdownInterval);
    function update() {
      const now = new Date();
      // build an array of upcoming times today (or tomorrow if passed)
      const order = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
      const timesToday = order.map(k => {
        const t = timings[k]; // format HH:MM (24h)
        const [hh,mm] = t.split(':').map(Number);
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0);
        return {key:k, date:d};
      });
      // If current time before Fajr but after midnight, consider Fajr today; else find next; if none, take tomorrow Fajr by adding 1 day
      let next = timesToday.find(t => t.date > now);
      if (!next) {
        // use Fajr of tomorrow: approximate by adding 1 day and using timings['Fajr'] (note: API gives only today; for perfect accuracy we should refetch for next day — acceptable to add 1 day)
        const [hh,mm] = timings['Fajr'].split(':').map(Number);
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, hh, mm, 0);
        next = {key:'Fajr', date:d};
      }
      const diff = Math.max(0, Math.floor((next.date - now)/1000));
      const hh = String(Math.floor(diff/3600)).padStart(2,'0');
      const mm = String(Math.floor((diff%3600)/60)).padStart(2,'0');
      const ss = String(diff%60).padStart(2,'0');
      document.getElementById('nextBlock').style.display = '';
      document.getElementById('nextName').textContent = turkishNames[next.key] || next.key;
      document.getElementById('countdown').textContent = `${hh}:${mm}:${ss}`;
    }
    update();
    countdownInterval = setInterval(update, 1000);
  }

  // refresh every 10 minutes
  fetchTimings();
  setInterval(fetchTimings, 10*60*1000);
</script>
</body>
</html>
